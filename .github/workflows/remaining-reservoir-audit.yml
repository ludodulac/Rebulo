name: Remaining reservoir audit

on:
  push:
    branches: [audit-remaining-reservoir-after-wave5]
    paths:
      - 'scripts/audit-rebus-remaining-reservoir.mjs'
      - 'scripts/finalize-rebus-remaining-reservoir-audit.mjs'
      - '.github/workflows/remaining-reservoir-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remaining-reservoir-after-wave5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run remaining reservoir diagnostic
        run: node scripts/audit-rebus-remaining-reservoir.mjs
      - name: Finalize editorial audit
        run: node scripts/finalize-rebus-remaining-reservoir-audit.mjs
      - name: Commit audit outputs
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-remaining-reservoir-audit-diagnostic.json docs/REBUS_REMAINING_RESERVOIR_DIAGNOSTIC.md data/rebus-remaining-reservoir-audit.json docs/REBUS_REMAINING_RESERVOIR_AUDIT.md
          git commit -m 'Materialize final remaining reservoir audit' || exit 0
          git push origin HEAD:audit-remaining-reservoir-after-wave5
