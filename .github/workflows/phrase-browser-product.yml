name: Phrase browser product

on:
  pull_request:
    paths:
      - '.github/workflows/phrase-browser-product.yml'
      - 'src/app-bootstrap.js'
      - 'src/play-mode.js'
      - 'src/phrase-mode.js'
      - 'src/phrase-planner-worker.js'
      - 'src/rebus-phrase-phonetics.js'
      - 'src/rebus-representation-paths.js'
      - 'src/creator-kind.js'
      - 'src/rebulo-visible-batch1-*.js'
      - 'assets/rebus/visible-batch1/**'
      - 'phrase-mode.css'
      - 'tests/phrase-browser-product.e2e.mjs'
      - 'tests/compact-runtime-browser.e2e.mjs'
      - 'tests/word-lifecycle-trace.e2e.mjs'
      - 'tests/phrase-runtime-diagnostic.mjs'
      - 'tests/rebulo-visible-batch1.e2e.mjs'
      - 'data/rebulo-compact-runtime.json'
      - 'data/rebus-pronunciation-lexicon.json'
  push:
    branches: [main]
    paths:
      - 'src/app-bootstrap.js'
      - 'src/play-mode.js'
      - 'src/phrase-mode.js'
      - 'src/phrase-planner-worker.js'
      - 'src/rebus-phrase-phonetics.js'
      - 'src/rebus-representation-paths.js'
      - 'src/creator-kind.js'
      - 'src/rebulo-visible-batch1-*.js'
      - 'assets/rebus/visible-batch1/**'
      - 'phrase-mode.css'
      - 'tests/phrase-browser-product.e2e.mjs'
      - 'tests/compact-runtime-browser.e2e.mjs'
      - 'tests/word-lifecycle-trace.e2e.mjs'
      - 'tests/phrase-runtime-diagnostic.mjs'
      - 'tests/rebulo-visible-batch1.e2e.mjs'
      - 'data/rebulo-compact-runtime.json'
      - 'data/rebus-pronunciation-lexicon.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Internal runtime diagnostic
        run: node tests/phrase-runtime-diagnostic.mjs
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Benchmark currently deployed public product before merge
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_URL: https://ludodulac.github.io/Rebulo/
          OUTPUT_JSON: phrase-browser-public-before.json
          CPU_THROTTLE: '4'
        run: node tests/phrase-browser-product.e2e.mjs
      - name: Start checkout static site
        run: |
          python3 -m http.server 4173 >/tmp/rebulo-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rebulo-http.log
          exit 1
      - name: Trace early Create Word lifecycle
        env:
          BASE_URL: http://127.0.0.1:4173/
          OUTPUT_JSON: word-lifecycle-trace.json
          CPU_THROTTLE: '4'
        run: node tests/word-lifecycle-trace.e2e.mjs
      - name: Verify checkout product in browser
        env:
          BASE_URL: http://127.0.0.1:4173/
          OUTPUT_JSON: compact-runtime-browser-checkout.json
          CPU_THROTTLE: '4'
        run: node tests/compact-runtime-browser.e2e.mjs
      - name: Verify visible Rebulo batch on mobile and desktop
        env:
          BASE_URL: http://127.0.0.1:4173/
          OUTPUT_JSON: visible-batch1-browser.json
        run: node tests/rebulo-visible-batch1.e2e.mjs
      - name: Verify deployed public product
        if: github.event_name == 'push'
        env:
          BASE_URL: https://ludodulac.github.io/Rebulo/
          OUTPUT_JSON: compact-runtime-browser-public.json
          CPU_THROTTLE: '4'
        run: node tests/compact-runtime-browser.e2e.mjs
      - name: Verify visible batch on deployed public product
        if: github.event_name == 'push'
        env:
          BASE_URL: https://ludodulac.github.io/Rebulo/
          OUTPUT_JSON: visible-batch1-public.json
        run: node tests/rebulo-visible-batch1.e2e.mjs
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phrase-browser-product-diagnostics
          path: |
            phrase-runtime-diagnostic.json
            phrase-browser-public-before.json
            compact-runtime-browser-checkout.json
            compact-runtime-browser-public.json
            word-lifecycle-trace.json
            visible-batch1-browser.json
            visible-batch1-public.json
            phrase-browser-*.png
            visible-batch1-*.png
          if-no-files-found: warn
