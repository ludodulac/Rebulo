name: Rebulo product tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'app.js'
      - 'package.json'
      - 'src/**'
      - 'scripts/build-rebus-productive-bank-wave2.mjs'
      - 'scripts/build-rebus-productive-bank-wave4*.mjs'
      - 'scripts/build-rebus-productive-bank-wave5*.mjs'
      - 'tests/**'
      - 'data/rebus-fragment-representation-ideas.json'
      - 'data/rebus-productive-bank-wave1.json'
      - 'data/rebus-productive-bank-wave2.json'
      - 'data/rebus-productive-bank-wave2-phrase-coverage.json'
      - 'data/rebus-productive-bank-wave3*.json'
      - 'data/rebus-productive-bank-wave4*.json'
      - 'data/rebus-productive-bank-wave5*.json'
      - 'data/rebus-representation-expansion-queue.json'
      - 'data/rebus-representation-differential-preselection.json'
      - 'data/rebus-sound-visual-curation*.json'
  pull_request:
    paths:
      - 'app.js'
      - 'package.json'
      - 'src/**'
      - 'scripts/build-rebus-productive-bank-wave2.mjs'
      - 'scripts/build-rebus-productive-bank-wave4*.mjs'
      - 'scripts/build-rebus-productive-bank-wave5*.mjs'
      - 'tests/**'
      - 'data/rebus-fragment-representation-ideas.json'
      - 'data/rebus-productive-bank-wave1.json'
      - 'data/rebus-productive-bank-wave2.json'
      - 'data/rebus-productive-bank-wave2-phrase-coverage.json'
      - 'data/rebus-productive-bank-wave3*.json'
      - 'data/rebus-productive-bank-wave4*.json'
      - 'data/rebus-productive-bank-wave5*.json'
      - 'data/rebus-representation-expansion-queue.json'
      - 'data/rebus-representation-differential-preselection.json'
      - 'data/rebus-sound-visual-curation*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser entry syntax
        run: node --check app.js
      - name: Generate productive phonetic bank wave 2
        run: node scripts/build-rebus-productive-bank-wave2.mjs
      - name: Run project tests
        run: npm test
      - name: Validate productive representation wave
        run: node tests/productive-representation-wave1.test.mjs
      - name: Validate productive phonetic bank wave
        run: node tests/rebus-productive-bank-wave1.test.mjs
      - name: Validate productive phonetic bank wave 2
        run: node tests/rebus-productive-bank-wave2.test.mjs
      - name: Validate productive phonetic bank wave 4
        run: node tests/rebus-productive-bank-wave4.test.mjs
      - name: Validate productive phonetic bank wave 5
        run: node tests/rebus-productive-bank-wave5.test.mjs
      - name: Run pictogram research triage regression
        run: node tests/pictogram-research-triage.test.mjs
      - name: Verify jsPDF browser dependency
        run: curl --fail --location --silent --show-error --output /dev/null 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/+esm'
