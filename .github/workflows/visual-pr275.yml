name: PR275 visual validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: head
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          cd head
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static servers
        run: |
          python3 -m http.server 4173 --directory head > /tmp/rebulo-head.log 2>&1 &
          python3 -m http.server 4174 --directory base > /tmp/rebulo-base.log 2>&1 &
          sleep 2
      - name: Capture responsive states
        run: node head/tests/visual-pr275-capture.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr275-visual-comparison
          path: head/visual-output
          if-no-files-found: error
