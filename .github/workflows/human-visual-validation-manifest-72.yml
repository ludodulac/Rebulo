name: Human visual validation manifest 72
on:
  push:
    branches:
      - analysis/human-visual-validation-manifest-72
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate final 72-concept manifest
        run: node tests/human-visual-validation-manifest-72.test.mjs
