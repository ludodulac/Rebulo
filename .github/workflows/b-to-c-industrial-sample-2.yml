name: B to C industrial sample 2

on:
  push:
    branches:
      - analysis/b-to-c-industrial-sample-2
    paths:
      - scripts/build-b-to-c-industrial-sample-2.mjs
      - scripts/prepare-b-to-c-sample-2-editorial-audits.mjs
      - .github/workflows/b-to-c-industrial-sample-2.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/b-to-c-industrial-sample-2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build sample 2
        run: node scripts/build-b-to-c-industrial-sample-2.mjs
      - name: Prepare editorial audit sheets
        run: node scripts/prepare-b-to-c-sample-2-editorial-audits.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/b-to-c-industrial-sample-2-2000.jsonl data/b-to-c-industrial-sample-2-metrics.json data/b-to-c-industrial-sample-2-rescue-candidates.json data/b-to-c-industrial-sample-2-ab-audit-candidates.json docs/B_TO_C_SAMPLE_2_RESCUE_REVIEW_SHEET.md docs/B_TO_C_SAMPLE_2_AB_AUDIT_SHEET.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize sample 2 editorial audit sheets"
            git push origin HEAD:analysis/b-to-c-industrial-sample-2
          fi
