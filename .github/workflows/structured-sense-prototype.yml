name: Structured sense source prototype

on:
  push:
    branches:
      - analysis/structured-sense-source-prototype
    paths:
      - scripts/select-independent-sense-gold.mjs
      - scripts/apply-independent-gold-editorial-review.mjs
      - scripts/emit-independent-gold-review-sheet.mjs
      - scripts/probe-kaikki-endpoint.mjs
      - scripts/inspect-kaikki-record.mjs
      - scripts/build-structured-sense-prototype.mjs
      - scripts/diagnose-structured-sense-filter.mjs
      - scripts/finalize-structured-sense-evaluation.mjs
      - scripts/count-structured-source-entries.mjs
      - scripts/lib/structured-sense-visual-filter.mjs
      - tests/structured-sense-source-prototype.test.mjs
      - .github/workflows/structured-sense-prototype.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/structured-sense-source-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze independent gold selection
        run: node scripts/select-independent-sense-gold.mjs
      - name: Apply independent editorial gold labels
        run: node scripts/apply-independent-gold-editorial-review.mjs
      - name: Emit compact review sheet
        run: node scripts/emit-independent-gold-review-sheet.mjs
      - name: Probe Kaikki endpoint
        run: node scripts/probe-kaikki-endpoint.mjs
      - name: Inspect Kaikki record schema
        run: node scripts/inspect-kaikki-record.mjs
      - name: Build structured source prototype
        run: node scripts/build-structured-sense-prototype.mjs
      - name: Final strict evaluation
        run: node scripts/finalize-structured-sense-evaluation.mjs
      - name: Count raw source entries
        run: node scripts/count-structured-source-entries.mjs
      - name: Diagnose filter
        run: node scripts/diagnose-structured-sense-filter.mjs
      - name: Validate
        run: node tests/structured-sense-source-prototype.test.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/independent-sense-gold-150.json data/independent-sense-gold-150-review-sheet.tsv data/structured-sense-*.json data/structured-sense-*.jsonl; do
            [ -e "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize structured sense source prototype"
            git push origin HEAD:analysis/structured-sense-source-prototype
          fi
