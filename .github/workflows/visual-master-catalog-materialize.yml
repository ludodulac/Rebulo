name: Visual master catalog materialize

on:
  push:
    branches: [visual-master-catalog]
    paths:
      - 'scripts/build-rebulo-visual-master-catalog.mjs'
      - 'tests/rebulo-visual-master-catalog.test.mjs'
      - 'data/rebulo-visual-asset-evidence-72.json'
      - '.github/workflows/visual-master-catalog-materialize.yml'
  pull_request:
    paths:
      - 'scripts/build-rebulo-visual-master-catalog.mjs'
      - 'tests/rebulo-visual-master-catalog.test.mjs'
      - 'data/rebulo-visual-master-catalog.json'
      - 'data/rebulo-visual-production-queue.csv'
      - 'data/rebulo-visual-asset-evidence-72.json'
      - 'docs/REBULO_VISUAL_MASTER_CATALOG_REPORT.md'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'visual-master-catalog' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build visual master catalog
        run: node scripts/build-rebulo-visual-master-catalog.mjs
      - name: Validate visual master catalog
        run: node tests/rebulo-visual-master-catalog.test.mjs
      - name: Commit generated outputs on branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebulo-visual-master-catalog.json data/rebulo-visual-production-queue.csv docs/REBULO_VISUAL_MASTER_CATALOG_REPORT.md
          git commit -m 'Materialize Rebulo visual master catalog' || exit 0
          git push origin HEAD:visual-master-catalog
