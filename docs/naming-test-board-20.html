<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebulo — Test de dénomination 20 items</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f5f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(760px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 16px 48px rgba(0,0,0,.08)}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}
h1{font-size:20px;margin:0;font-weight:700}.counter{font-variant-numeric:tabular-nums;color:#666}
.stage{min-height:480px;display:grid;place-items:center;border:1px solid #e5e5e0;border-radius:22px;background:#fff;padding:28px}
.stage img{display:block;width:min(420px,80vw);height:min(360px,60vh);object-fit:contain}
.question{text-align:center;font-size:30px;font-weight:700;margin:24px 0 18px}
.controls{display:flex;gap:12px;justify-content:center}.controls button{appearance:none;border:0;border-radius:999px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer;background:#111;color:#fff}.controls button.secondary{background:#ecece7;color:#111}.controls button:disabled{opacity:.35;cursor:default}
.note{text-align:center;color:#777;font-size:13px;margin:16px 0 0}
@media print{.controls,.note{display:none}body{background:#fff;padding:0}main{box-shadow:none;width:100%;padding:0}.stage{border:0;min-height:70vh}.question{font-size:26px}}
</style>
</head>
<body>
<main>
<header><h1>Test de dénomination</h1><div class="counter" id="counter">01 / 20</div></header>
<section class="stage"><img id="stimulus" alt="Stimulus visuel"></section>
<p class="question">Qu’est-ce que c’est&nbsp;?</p>
<div class="controls"><button class="secondary" id="prev" type="button">Précédent</button><button id="next" type="button">Suivant</button></div>
<p class="note">Noter uniquement la première réponse spontanée. Ne donner aucun indice et ne corriger qu’après la fin.</p>
</main>
<script>
const stimuli=[
  "../assets/research/raie-swimming.svg",
  "../assets/research/pot-empty-tapered.svg",
  "../assets/research/dos-back-outline.svg",
  "../assets/research/terre-mound.svg",
  "../assets/research/tas-stones.svg",
  "../assets/rebus/pot.svg",
  "../assets/research/raie-spotted.svg",
  "../assets/research/terre-cross-section.svg",
  "../assets/research/dos-rear-silhouette.svg",
  "../assets/research/tas-dirt.svg",
  "../assets/research/pot-empty-saucer.svg",
  "../assets/research/raie-silhouette.svg",
  "../assets/research/tas-blocks.svg",
  "../assets/research/dos-openmoji-backache-e321.svg",
  "../assets/research/terre-clods.svg",
  "../assets/research/pot-empty-cylinder.svg",
  "../assets/research/dos-highlighted-back.svg",
  "../assets/research/tas-mixed-objects.svg",
  "../assets/research/raie-outline.svg",
  "../assets/research/terre-patch.svg"
];
let index=0;
const image=document.getElementById("stimulus");
const counter=document.getElementById("counter");
const prev=document.getElementById("prev");
const next=document.getElementById("next");
function render(){image.src=stimuli[index];counter.textContent=String(index+1).padStart(2,"0")+" / "+stimuli.length;prev.disabled=index===0;next.textContent=index===stimuli.length-1?"Terminé":"Suivant";}
prev.addEventListener("click",()=>{if(index>0){index--;render();}});
next.addEventListener("click",()=>{if(index<stimuli.length-1){index++;render();}});
document.addEventListener("keydown",event=>{if(event.key==="ArrowRight"&&index<stimuli.length-1){index++;render();}if(event.key==="ArrowLeft"&&index>0){index--;render();}});
render();
</script>
</body>
</html>
