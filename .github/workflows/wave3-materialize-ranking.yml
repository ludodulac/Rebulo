name: Wave 3 ranking materialization

on:
  push:
    branches:
      - productive-bank-wave3-yield
    paths:
      - '.github/workflows/wave3-materialize-ranking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productive-bank-wave3-yield
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ranking and provisional editorial outputs
        run: node scripts/build-rebus-productive-bank-wave3.mjs
      - name: Commit provisional research outputs for curation
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-productive-bank-wave3.json data/rebus-productive-bank-wave3-impact-ranking.json data/rebus-productive-bank-wave3-benchmarks.json data/rebus-productive-bank-wave3-useful-metrics.json docs/REBUS_PRODUCTIVE_BANK_WAVE3_REPORT.md
          git commit -m 'Materialize provisional wave 3 ranking' || exit 0
          git push origin HEAD:productive-bank-wave3-yield
