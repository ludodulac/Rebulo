name: B to C POS sense audit

on:
  push:
    branches:
      - analysis/b-to-c-industrial-sample-2000
    paths:
      - scripts/audit-b-to-c-pos-sense-preservation.mjs
      - .github/workflows/b-to-c-pos-sense-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/b-to-c-industrial-sample-2000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-b-to-c-pos-sense-preservation.mjs
      - name: Commit audit artifact
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/b-to-c-industrial-sample-2000-pos-sense-audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Materialize B-to-C POS and sense audit"
            git push origin HEAD:analysis/b-to-c-industrial-sample-2000
          fi
