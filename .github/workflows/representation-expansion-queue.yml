name: Representation expansion queue

on:
  push:
    branches: [main, 'research/**', 'editorial/representation-wave3']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expansion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard expansion evidence levels
        run: node tests/rebus-representation-expansion.test.mjs
      - name: Guard differential preselection evidence levels
        run: node tests/rebus-representation-differential-preselection.test.mjs
      - name: Build expansion queue
        run: node scripts/build-representation-expansion-queue.mjs
      - name: Build differential homophone preselection
        run: node scripts/build-representation-differential-preselection.mjs
      - name: Verify substantive conservative output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('data/rebus-representation-expansion-queue.json','utf8'));
          const preselection=JSON.parse(fs.readFileSync('data/rebus-representation-differential-preselection.json','utf8'));
          if(report.status!=='research_mapping_only')throw new Error('expansion output must remain research-only');
          if(report.stats.soundCount<800)throw new Error(`expected substantial queue, got ${report.stats.soundCount}`);
          if(report.stats.twoSyllableSoundCount<350)throw new Error(`two-syllable reserve collapsed: ${report.stats.twoSyllableSoundCount}`);
          if(report.stats.multipleExactHomophoneSoundCount<1)throw new Error('expected multiple exact-homophone cases');
          if(report.subqueues?.existingAssetReview?.length<1)throw new Error('expected existing assets to surface before new drawing');
          if(report.subqueues?.twoSyllableFirstClass?.length<100)throw new Error('expected a useful long-window review queue');
          if(report.rows.some(row=>row.proofStatus?.orthophonicValidation!=='none'))throw new Error('queue must not invent orthophonic validation');
          if(report.rows.some(row=>row.automaticActivation!==false))throw new Error('queue must not auto-activate representations');
          if(report.rows.some(row=>row.exactCandidates?.some(candidate=>candidate.namingRisk && candidate.namingRisk!=='unknown' && candidate.proofStatus==='lexical_exact_only')))throw new Error('uncurated lexical candidates must not receive invented naming risk');
          if(report.rows.some(row=>row.exactCandidates?.some(candidate=>candidate.knownAssets?.some(asset=>asset.assetKind==='research_filename_match'&&asset.registeredPhoneticMatch))))throw new Error('research filenames must not invent registered IPA evidence');
          if(preselection.status!=='research_preselection_only'||preselection.stats.preselectedSoundCount<220)throw new Error('expected a large auditable preselection');
          if(preselection.stats.twoSyllableSoundCount<80)throw new Error('two-syllable preselection reserve collapsed');
          if(preselection.rows.some(row=>row.visualDecision!=='unknown'||row.spontaneousNamingRisk!=='unknown'||row.humanNamingEvidence!=='none'||row.clinicalEvidence!=='none'||row.automaticActivation!==false))throw new Error('preselection must never invent visual, naming, activation or clinical evidence');
          console.log(JSON.stringify({expansion:report.stats,preselection:preselection.stats},null,2));
          NODE
      - name: Upload expansion artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebulo-representation-expansion-queue
          path: |
            data/rebus-representation-expansion-queue.json
            docs/REBUS_REPRESENTATION_EXPANSION_QUEUE.md
            data/rebus-representation-differential-preselection.json
            docs/REBUS_REPRESENTATION_DIFFERENTIAL_PRESELECTION.md
      - name: Commit generated queue on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-representation-expansion-queue.json docs/REBUS_REPRESENTATION_EXPANSION_QUEUE.md data/rebus-representation-differential-preselection.json docs/REBUS_REPRESENTATION_DIFFERENTIAL_PRESELECTION.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Refresh representation expansion queue and differential preselection'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
