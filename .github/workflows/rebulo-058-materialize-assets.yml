name: REBULO-058 materialize lot-002 binary assets

on:
  push:
    branches:
      - feat/rebulo-058-lot002
    paths:
      - 'ops/rebulo-058-materialize.ready'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rebulo-058-lot002

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Execute existing REBULO-058 builder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rebulo058 assets/validation-candidates/lot-002
          mkdir -p /tmp/rebulo058
          cp ops/rebulo-058-sources/*.png /tmp/rebulo058/
          python scripts/rebulo-058-build-lot002-assets.py

      - name: Technical materialization audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          root=Path('assets/validation-candidates/lot-002')
          files=sorted(root.glob('*.png'))
          assert len(files)==50, f'expected 50 PNG, got {len(files)}'

          empty=[]
          corrupt=[]
          no_transparency=[]
          edge_touch=[]
          rows=[]

          for p in files:
              size=p.stat().st_size
              if size<=0:
                  empty.append(p.name)
                  continue
              try:
                  with Image.open(p) as im:
                      im.verify()
                  with Image.open(p).convert('RGBA') as im:
                      alpha=im.getchannel('A')
                      extrema=alpha.getextrema()
                      bbox=alpha.getbbox()
                      if extrema[0] != 0:
                          no_transparency.append(p.name)
                      if not bbox:
                          corrupt.append(p.name+': empty alpha')
                          margins=None
                      else:
                          l,t,r,b=bbox
                          margins=[l,t,im.width-r,im.height-b]
                          if min(margins)<=0:
                              edge_touch.append(p.name)
                      rows.append({
                          'file':p.name,
                          'bytes':size,
                          'dimensions':[im.width,im.height],
                          'alpha_extrema':list(extrema),
                          'alpha_bbox':list(bbox) if bbox else None,
                          'margins':margins
                      })
              except Exception as exc:
                  corrupt.append(p.name+': '+str(exc))

          audit={
              'schema_version':1,
              'lot_id':'lot-002',
              'png_count':len(files),
              'empty_files':empty,
              'corrupt_files':corrupt,
              'files_without_transparent_pixels':no_transparency,
              'obvious_cropping_edge_touch':edge_touch,
              'technical_status':'PASS' if not (empty or corrupt or no_transparency or edge_touch) else 'FAIL',
              'files':rows
          }
          Path('data/image-validation/lot-002-materialization-audit.json').write_text(
              json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps({k:v for k,v in audit.items() if k!='files'},ensure_ascii=False,indent=2))
          assert audit['technical_status']=='PASS'
          PY

      - name: Commit materialized assets and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rebulo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/validation-candidates/lot-002 data/image-validation/lot-002-materialization-audit.json
          git rm -f ops/rebulo-058-materialize.ready .github/workflows/rebulo-058-materialize-assets.yml
          git commit -m "REBULO-058: materialize and audit 50 lot-002 PNG assets [skip ci]"
          git push origin HEAD:feat/rebulo-058-lot002
