<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Rebulo</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="arena-focus.css"><link rel="stylesheet" href="feedback.css"><link rel="stylesheet" href="audit.css"></head>
<body><main class="app-shell single-screen">
<header class="topbar"><h1>Rebulo</h1><span class="strict-badge" title="Rebulo garde tous les sons">✓ Exact</span></header>

<section class="search-zone" aria-labelledby="creator-title"><h2 id="creator-title" class="sr-only">Créer un rébus</h2><form id="creatorForm" class="creator-form"><label class="sr-only" for="target">Mot à transformer</label><div class="creator-row"><input id="target" type="text" autocomplete="off" autocapitalize="none" placeholder="Écris un mot" value="merci" aria-label="Mot à transformer"><button type="submit">Créer</button></div></form><div id="creatorFeedback" class="creator-feedback" aria-live="polite"></div></section>

<section id="result" class="arena" data-sheet-mode="pro" hidden><div class="arena-head"><div><p id="resultLabel" class="result-label">Pro</p><h3 id="resultWord">Merci</h3></div><div class="sheet-mode" role="group" aria-label="Type de fiche"><button id="childMode" type="button" class="secondary mini-mode" aria-pressed="false" aria-label="Vue enfant">👧</button><button id="proMode" type="button" class="mini-mode" aria-pressed="true" aria-label="Vue professionnelle">🧑</button></div></div>
<p id="sheetInstruction" class="sheet-instruction"></p><section id="therapyPanel" class="therapy-panel" hidden><strong id="therapyLabel"></strong><p id="therapyDescription" class="therapy-description"></p><p id="therapyInstruction" class="therapy-instruction"></p></section>
<div id="creatorRebus" class="rebus-row" aria-live="polite"></div><p id="phoneticProof" class="phonetic-proof"></p><div id="worksheetAnswer" class="worksheet-answer" hidden>Réponse : <span aria-hidden="true"></span></div>
<div class="arena-actions"><button id="addToWorksheet" type="button">＋ Ajouter</button><button id="downloadRebus" type="button" class="secondary">PDF</button><button id="changeImage" type="button" class="secondary icon-action" aria-label="Changer l’image" title="Changer l’image">🖼️</button></div><p id="exportFeedback" class="export-feedback" aria-live="polite"></p></section>

<section class="session-dock" aria-label="Séance"><div class="queue-actions"><strong>Séance</strong><span id="queueCount">0 / 4</span></div><div id="worksheetQueue" class="worksheet-queue" aria-live="polite"></div><button id="downloadSeries" type="button" class="secondary session-pdf" disabled>PDF</button></section>

<nav class="bottom-nav" aria-label="Navigation principale"><details class="dock-panel"><summary aria-label="Séance">📚<span>Séance</span></summary><div class="drawer"><div class="drawer-head"><strong>Ma séance</strong></div><p class="drawer-hint">Les rébus ajoutés restent visibles juste au-dessus.</p><button id="printRebus" type="button" class="secondary full-action">Imprimer</button></div></details>
<details class="dock-panel"><summary aria-label="Créer">✨<span>Créer</span></summary><div class="drawer compact-drawer"><strong>Créer</strong><p>Écris ton mot en haut. Rebulo garde tous les sons.</p></div></details>
<details class="dock-panel"><summary aria-label="Options">⚙️<span>Options</span></summary><div class="drawer"><div class="drawer-head"><strong>Options</strong></div><div class="worksheet-fields"><label for="patientName">Nom<input id="patientName" type="text" autocomplete="off" placeholder="Facultatif"></label><label for="sessionDate">Date<input id="sessionDate" type="date"></label><label for="worksheetLevel">Niveau<select id="worksheetLevel"><option value="">—</option><option value="Découverte">Découverte</option><option value="Entraînement">Entraînement</option><option value="Consolidation">Consolidation</option></select></label><label for="therapyActivity">Activité<select id="therapyActivity"></select></label><label for="worksheetLayout">PDF<select id="worksheetLayout"><option value="1">1/page</option><option value="2">2/page</option><option value="4">4/page</option></select></label></div><details id="assetAuditPanel" class="asset-audit"><summary>Images</summary><p id="assetAuditSummary" class="asset-audit-summary"></p><div id="assetAuditList" class="asset-audit-list"></div></details></div></details></nav>

<section class="legacy-tools" hidden aria-hidden="true"><div class="game-drawer"><section class="controls" aria-label="Réglages du jeu"><label for="age">Âge</label><select id="age"><option value="5">5–6 ans</option><option value="7" selected>7–8 ans</option><option value="9">9–11 ans</option><option value="12">12 ans et +</option></select><button id="newRebus" type="button">Nouveau</button></section><section class="game-card"><div class="game-meta"><span id="difficulty">Niveau 1</span><span id="streak">🔥 0</span><span class="score-box">⭐ <strong id="score">0</strong></span></div><p class="prompt">Quel mot entends-tu ?</p><div id="rebus" class="rebus-row"></div><form id="answerForm"><label class="sr-only" for="answer">Ta réponse</label><div class="answer-row"><input id="answer" type="text" autocomplete="off" autocapitalize="none" placeholder="Ta réponse…"><button type="submit">OK</button></div></form><div class="secondary-actions"><button id="hint" type="button" class="secondary">💡</button><button id="solution" type="button" class="secondary">👀</button></div><p id="feedback" class="feedback"></p></section></div></section>
</main><script src="app.js" type="module"></script><script src="src/ui-feedback.js" type="module"></script></body></html>
