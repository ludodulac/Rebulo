name: Dominant sense sealed holdout
on:
  push:
    branches: [analysis/dominant-sense-semantic-ranking]
    paths:
      - scripts/build-dominant-sense-holdout.mjs
      - .github/workflows/dominant-sense-holdout.yml
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/dominant-sense-semantic-ranking
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen model file belongs to v4
        run: grep -q "dominant-sense-semantic-v4" scripts/lib/dominant-sense-semantic-model.mjs
      - name: Evaluate sealed holdout exactly once
        run: node scripts/build-dominant-sense-holdout.mjs
      - name: Commit sealed holdout artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/dominant-sense-holdout-source.jsonl data/dominant-sense-holdout-evaluation.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Materialize sealed dominant-sense holdout evaluation" && git push origin HEAD:analysis/dominant-sense-semantic-ranking; fi
