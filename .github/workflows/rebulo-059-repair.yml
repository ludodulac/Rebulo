name: REBULO-059 materialize extraction repairs

on:
  push:
    branches:
      - feat/rebulo-059-extraction-repair
    paths:
      - 'ops/rebulo-059-repair.ready'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rebulo-059-extraction-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Run faithful extraction repair
        run: python scripts/rebulo-059-repair-extractions.py
      - name: Verify repair outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/validation-candidates/lot-002-extraction-repair -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "24"
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          audit=json.loads(Path('data/image-validation/lot-002-extraction-repair-audit.json').read_text())
          assert audit['source_images_checked']==23
          assert len(audit['source_actually_complete'])==23
          assert audit['source_already_truncated']==[]
          assert len(audit['repaired_extractions'])==23
          assert audit['doigt_complete'] is True
          for p in sorted(Path('assets/validation-candidates/lot-002-extraction-repair').glob('*.png')):
              assert p.stat().st_size>0
              im=Image.open(p)
              im.verify()
          print('REBULO-059_REPAIR_VERIFY PASS 24/24')
          PY
      - name: Commit repaired extraction candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rebulo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             assets/validation-candidates/lot-002-extraction-repair             data/image-validation/lot-002-extraction-repair-audit.json             validation-images/lots/lot-002-extraction-repair.json
          git rm -f ops/rebulo-059-repair.ready .github/workflows/rebulo-059-repair.yml
          git commit -m "REBULO-059: materialize faithful extraction repairs [skip ci]"
          git push origin HEAD:feat/rebulo-059-extraction-repair
