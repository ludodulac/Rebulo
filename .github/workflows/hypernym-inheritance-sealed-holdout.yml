name: Hypernym inheritance sealed holdout
on:
  push:
    branches: [analysis/structured-hypernym-inheritance-pos-holdout]
    paths:
      - .github/workflows/hypernym-inheritance-sealed-holdout.yml
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/structured-hypernym-inheritance-pos-holdout
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify frozen v2 model and sealed gold
        run: |
          grep -q "structured-hypernym-inheritance-pos-v2" scripts/lib/structured-hypernym-inheritance-model.mjs
          grep -q '"sourceLookedAt": false' data/hypernym-inheritance-sealed-gold-180.json
      - name: Evaluate final sealed holdout exactly once
        run: node scripts/run-hypernym-inheritance-sealed-evaluation.mjs holdout
      - name: Commit sealed holdout artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/hypernym-inheritance-sealed-holdout-source.jsonl data/hypernym-inheritance-sealed-holdout-evaluation.json
          if git diff --cached --quiet; then echo no-change; else git commit -m "Materialize sealed hypernym inheritance holdout evaluation" && git push origin HEAD:analysis/structured-hypernym-inheritance-pos-holdout; fi