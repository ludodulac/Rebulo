name: Dominant sense development
on:
  push:
    branches: [analysis/dominant-sense-semantic-ranking]
    paths:
      - scripts/build-dominant-sense-development.mjs
      - scripts/lib/dominant-sense-semantic-model.mjs
      - .github/workflows/dominant-sense-development.yml
permissions:
  contents: write
jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/dominant-sense-semantic-ranking
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate development partition only
        run: node scripts/build-dominant-sense-development.mjs
      - name: Commit development artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/dominant-sense-development-source.jsonl data/dominant-sense-development-evaluation.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Materialize dominant-sense development evaluation" && git push origin HEAD:analysis/dominant-sense-semantic-ranking; fi
