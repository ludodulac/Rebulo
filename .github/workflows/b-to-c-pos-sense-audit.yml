name: B to C POS sense audit

on:
  push:
    branches:
      - analysis/b-to-c-industrial-sample-2000
    paths:
      - scripts/audit-b-to-c-pos-sense-preservation.mjs
      - scripts/build-b-to-c-pos-sense-preserved-view.mjs
      - scripts/report-b-to-c-pos-sense-class-changes.mjs
      - .github/workflows/b-to-c-pos-sense-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/b-to-c-industrial-sample-2000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit lexical identity
        run: node scripts/audit-b-to-c-pos-sense-preservation.mjs
      - name: Build POS/sense-preserved view
        run: node scripts/build-b-to-c-pos-sense-preserved-view.mjs
      - name: Report class changes
        run: node scripts/report-b-to-c-pos-sense-class-changes.mjs
      - name: Commit audit artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/b-to-c-industrial-sample-2000-pos-sense-audit.json data/b-to-c-industrial-sample-2000-pos-sense-preserved.jsonl data/b-to-c-industrial-sample-2000-pos-sense-impact.json data/b-to-c-industrial-sample-2000-pos-sense-class-changes.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Materialize B-to-C POS and sense audit details"
            git push origin HEAD:analysis/b-to-c-industrial-sample-2000
          fi
