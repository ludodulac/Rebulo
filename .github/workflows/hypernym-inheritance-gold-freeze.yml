name: Hypernym inheritance gold freeze
on:
  push:
    branches: [analysis/structured-hypernym-inheritance-pos-holdout]
    paths:
      - scripts/select-hypernym-inheritance-gold-210.mjs
      - .github/workflows/hypernym-inheritance-gold-freeze.yml
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/structured-hypernym-inheritance-pos-holdout
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/select-hypernym-inheritance-gold-210.mjs
      - name: Commit sealed gold
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hypernym-inheritance-gold-210.json
          if git diff --cached --quiet; then echo no-change; else git commit -m "Seal hypernym inheritance gold before source lookup" && git push origin HEAD:analysis/structured-hypernym-inheritance-pos-holdout; fi