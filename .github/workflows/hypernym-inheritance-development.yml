name: Hypernym inheritance development
on:
  push:
    branches: [analysis/structured-hypernym-inheritance-pos-holdout]
    paths:
      - scripts/build-hypernym-inheritance-evaluation.mjs
      - scripts/lib/structured-hypernym-inheritance-model.mjs
      - .github/workflows/hypernym-inheritance-development.yml
permissions:
  contents: write
jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/structured-hypernym-inheritance-pos-holdout
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/build-hypernym-inheritance-evaluation.mjs development
      - name: Commit development artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/hypernym-inheritance-development-source.jsonl data/hypernym-inheritance-development-evaluation.json
          if git diff --cached --quiet; then echo no-change; else git commit -m "Materialize hypernym inheritance development evaluation" && git push origin HEAD:analysis/structured-hypernym-inheritance-pos-holdout; fi