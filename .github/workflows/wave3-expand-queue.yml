name: Wave 3 deeper expansion queue

on:
  push:
    branches:
      - productive-bank-wave3-yield
    paths:
      - '.github/workflows/wave3-expand-queue.yml'
      - 'scripts/build-representation-expansion-queue.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productive-bank-wave3-yield
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build deeper research queue
        run: node scripts/build-representation-expansion-queue.mjs
      - name: Commit queue only
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-representation-expansion-queue.json docs/REBUS_REPRESENTATION_EXPANSION_QUEUE.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Refresh deeper wave 3 expansion queue'
            git push origin HEAD:productive-bank-wave3-yield
          fi
