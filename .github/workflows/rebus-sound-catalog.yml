name: Rebus sound catalog research

on:
  push:
    paths:
      - '.github/workflows/rebus-sound-catalog.yml'
      - 'scripts/build-rebus-sound-catalog.mjs'
      - 'scripts/apply-rebus-sound-visual-curation.mjs'
      - 'scripts/import-lexique.mjs'
      - 'src/rebus-sound-catalog.js'
      - 'src/rebus-sound-visual-curation.js'
      - 'src/syllable-representation-candidates.js'
      - 'src/drawable-opportunities.js'
      - 'src/pictogram-print-sheets.js'
      - 'src/open-pictogram-library.js'
      - 'src/open-pictogram-library-wave2.js'
      - 'src/open-pictogram-library-wave3.js'
      - 'src/syllable-print-library.js'
      - 'data/rebus-visible-conventions.json'
      - 'data/rebus-sound-research-seeds.json'
      - 'data/rebus-sound-visual-curation.json'
      - 'data/phonetic-brick-candidates.json'
      - 'tests/rebus-sound-catalog.test.mjs'
      - 'tests/rebus-sound-visual-curation.test.mjs'
      - 'tests/syllable-representation-candidates.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/rebus-sound-catalog.yml'
      - 'scripts/build-rebus-sound-catalog.mjs'
      - 'scripts/apply-rebus-sound-visual-curation.mjs'
      - 'scripts/import-lexique.mjs'
      - 'src/rebus-sound-catalog.js'
      - 'src/rebus-sound-visual-curation.js'
      - 'src/syllable-representation-candidates.js'
      - 'src/drawable-opportunities.js'
      - 'src/pictogram-print-sheets.js'
      - 'src/open-pictogram-library.js'
      - 'src/open-pictogram-library-wave2.js'
      - 'src/open-pictogram-library-wave3.js'
      - 'src/syllable-print-library.js'
      - 'data/rebus-visible-conventions.json'
      - 'data/rebus-sound-research-seeds.json'
      - 'data/rebus-sound-visual-curation.json'
      - 'data/phonetic-brick-candidates.json'
      - 'tests/rebus-sound-catalog.test.mjs'
      - 'tests/rebus-sound-visual-curation.test.mjs'
      - 'tests/syllable-representation-candidates.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run sound-catalog regressions
        run: |
          node tests/rebus-sound-catalog.test.mjs
          node tests/rebus-sound-visual-curation.test.mjs
          node tests/syllable-representation-candidates.test.mjs
          node tests/syllable-print-library.test.mjs
          node tests/pictogram-print-sheets.test.mjs
      - name: Download Lexique 4 mirror
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/dorfner/pass_the_bomb/master/Lexique400/Lexique4.tsv' -o .cache/Lexique4.tsv
          test "$(wc -l < .cache/Lexique4.tsv)" -gt 180000
          sha256sum .cache/Lexique4.tsv | tee .cache/Lexique4.sha256
      - name: Import compact lexical data
        run: node scripts/import-lexique.mjs .cache/Lexique4.tsv .cache/lexique4.compact.json
      - name: Build one-to-two-syllable sound catalog
        run: node scripts/build-rebus-sound-catalog.mjs .cache/lexique4.compact.json data/rebus-sound-catalog.json docs/REBUS_SOUND_CATALOG_REPORT.md
      - name: Apply editorial visual curation
        run: node scripts/apply-rebus-sound-visual-curation.mjs data/rebus-sound-catalog.json .cache/lexique4.compact.json data/rebus-sound-visual-curation.json docs/REBUS_SOUND_VISUAL_CURATION_REPORT.md
      - name: Add Lexique provenance and verify useful output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='data/rebus-sound-catalog.json';
          const report=JSON.parse(fs.readFileSync(path,'utf8'));
          const sha256=fs.readFileSync('.cache/Lexique4.sha256','utf8').trim().split(/\s+/)[0];
          report.provenance={canonicalSource:'https://www.lexique.org/databases/Lexique400/Lexique400.tsv',mirror:'https://github.com/dorfner/pass_the_bomb/blob/master/Lexique400/Lexique4.tsv',sha256,license:'CC BY-SA 4.0'};
          if(report.formatVersion!==2)throw new Error('unexpected sound catalog format');
          if(!(report.stats?.windowCount>100))throw new Error('sound-window inventory unexpectedly small');
          if(!(report.stats?.openPictogramRepresentationCount>100))throw new Error('existing open pictogram library was not consolidated');
          if(!(report.stats?.oneSyllableWindowCount>0))throw new Error('one-syllable windows missing');
          if(!(report.stats?.twoSyllableWindowCount>0))throw new Error('two-syllable windows missing');
          if(report.soundRows?.length!==report.stats.windowCount)throw new Error('compact exhaustive sound rows are incomplete');
          if(!(report.visualResearchQueue?.length>0))throw new Error('visual research queue missing');
          if(!(report.newImageResearchQueue?.length>0))throw new Error('new-image research queue missing');
          if(!report.visualCuration?.validation?.valid)throw new Error('visual curation validation missing');
          if(!(report.visualCuration?.curatedPrototypeQueue?.length>0))throw new Error('curated prototype queue missing');
          if(!(report.visualCuration?.curatedNewImageResearchQueue?.length>0))throw new Error('curated image research queue missing');
          if(!fs.existsSync('docs/REBUS_SOUND_VISUAL_CURATION_REPORT.md'))throw new Error('visual curation report missing');
          fs.writeFileSync(path,JSON.stringify(report));
          console.log(JSON.stringify(report.stats,null,2));
          console.log(JSON.stringify(report.visualCuration.stats,null,2));
          console.log(`catalog bytes: ${fs.statSync(path).size}`);
          NODE
      - name: Upload catalog research artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebus-sound-catalog
          path: |
            data/rebus-sound-catalog.json
            docs/REBUS_SOUND_CATALOG_REPORT.md
            docs/REBUS_SOUND_VISUAL_CURATION_REPORT.md
          retention-days: 14
      - name: Commit generated catalog on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-sound-catalog.json docs/REBUS_SOUND_CATALOG_REPORT.md docs/REBUS_SOUND_VISUAL_CURATION_REPORT.md
          if git diff --cached --quiet; then echo 'No sound catalog changes to commit.'; exit 0; fi
          git commit -m 'Refresh rebus sound catalog'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
