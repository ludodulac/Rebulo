name: B to C industrial sample analysis

on:
  push:
    branches:
      - analysis/b-to-c-industrial-sample-2000
    paths:
      - scripts/build-b-to-c-industrial-sample.mjs
      - tests/b-to-c-industrial-sample.test.mjs
      - .github/workflows/b-to-c-industrial-sample-analysis.yml

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/b-to-c-industrial-sample-2000
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair isolated threshold serialization references
        run: |
          sed -i 's/preselectionScore:r.preselectionScore,lowScoreThreshold,/preselectionScore:r.preselectionScore,lowScoreThreshold:lowThreshold,/' scripts/build-b-to-c-industrial-sample.mjs
          sed -i 's/,lowScoreThreshold,rescue:/,lowScoreThreshold:lowThreshold,rescue:/' scripts/build-b-to-c-industrial-sample.mjs
      - name: Build industrial B-to-C sample
        run: node scripts/build-b-to-c-industrial-sample.mjs
      - name: Extract compact rescue review set
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=fs.readFileSync('data/b-to-c-industrial-sample-2000.jsonl','utf8').trim().split('\n').map(JSON.parse);
          const rescue=rows.filter(r=>r.selectionStratum==='low_score_rescue_random');
          const compact=rescue.map(r=>({sampleId:r.sampleId,ipa:r.ipa,exactWord:r.exactWord,lemma:r.lemma,pos:r.pos,frequency:r.frequency,preselectionScore:r.preselectionScore,conceptCategory:r.conceptCategory,anticipatedAlternativeNames:r.anticipatedAlternativeNames,scores:r.scores,aggregateScore:r.aggregateScore,provisionalClass:r.provisionalClass,inflectionLikely:r.inflectionLikely,orthographicVariantLikely:r.orthographicVariantLikely,humanNamingEvidence:r.humanNamingEvidence}));
          fs.writeFileSync('data/b-to-c-industrial-sample-2000-rescue-candidates.json',JSON.stringify({count:compact.length,rows:compact},null,2)+'\n');
          const header='sampleId\tipa\texactWord\tlemma\tpos\tfrequency\tpreselectionScore\tconceptCategory\tprovisionalClass';
          const lines=rescue.map(r=>[r.sampleId,r.ipa,r.exactWord,r.lemma,r.pos,r.frequency,r.preselectionScore,r.conceptCategory,r.provisionalClass].join('\t'));
          fs.writeFileSync('data/b-to-c-industrial-sample-2000-rescue-inspection.tsv',[header,...lines].join('\n')+'\n');
          NODE
      - name: Validate sample and calibration guards
        run: node tests/b-to-c-industrial-sample.test.mjs
      - name: Commit generated analysis artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build-b-to-c-industrial-sample.mjs data/b-to-c-industrial-sample-2000.jsonl data/b-to-c-industrial-sample-2000-metrics.json data/b-to-c-industrial-sample-2000-rescue-candidates.json data/b-to-c-industrial-sample-2000-rescue-inspection.tsv docs/B_TO_C_INDUSTRIAL_SAMPLE_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add compact B-to-C rescue inspection table"
            git push origin HEAD:analysis/b-to-c-industrial-sample-2000
          fi
