name: Representation landscape

on:
  push:
    branches: [main, 'research/representation-landscape', 'editorial/representation-wave2', 'editorial/representation-wave3', 'editorial/representation-wave4-materialization1', 'editorial/representation-wave5-materialization2', 'editorial/bank-wave6-naming-pilot', 'editorial/representation-wave7-scale', 'editorial/representation-wave8-net-new']
    paths:
      - 'src/rebus-representation-landscape.js'
      - 'src/rebus-representation-paths.js'
      - 'src/rebus-phrase-phonetics.js'
      - 'src/rebus-approximation.js'
      - 'scripts/build-representation-landscape.mjs'
      - 'scripts/benchmark-real-phrase-paths.mjs'
      - 'tests/rebus-representation-landscape.test.mjs'
      - 'data/rebus-representation-bank-audit.json'
      - 'data/rebus-sound-visual-curation.json'
      - 'data/rebus-sound-visual-curation-wave2.json'
      - 'data/rebus-sound-visual-curation-wave3.json'
      - 'data/rebus-sound-visual-curation-wave4.json'
      - 'data/rebus-sound-visual-curation-wave5.json'
      - 'data/rebus-sound-visual-curation-wave6.json'
      - 'data/rebus-sound-visual-curation-wave7.json'
      - 'data/rebus-sound-visual-curation-wave8.json'
      - 'data/rebus-materialization-wave1.json'
      - 'data/rebus-materialization-wave2.json'
      - 'data/rebus-materialization-wave3.json'
      - 'data/rebus-spontaneous-naming-pilot.json'
      - 'data/rebus-spontaneous-naming-responses-template.csv'
      - 'data/rebus-visible-conventions.json'
      - 'data/rebus-pronunciation-lexicon.json'
      - '.github/workflows/representation-landscape.yml'
  pull_request:
    paths:
      - 'src/rebus-representation-landscape.js'
      - 'src/rebus-representation-paths.js'
      - 'src/rebus-phrase-phonetics.js'
      - 'src/rebus-approximation.js'
      - 'scripts/build-representation-landscape.mjs'
      - 'scripts/benchmark-real-phrase-paths.mjs'
      - 'tests/rebus-representation-landscape.test.mjs'
      - 'data/rebus-representation-bank-audit.json'
      - 'data/rebus-sound-visual-curation.json'
      - 'data/rebus-sound-visual-curation-wave2.json'
      - 'data/rebus-sound-visual-curation-wave3.json'
      - 'data/rebus-sound-visual-curation-wave4.json'
      - 'data/rebus-sound-visual-curation-wave5.json'
      - 'data/rebus-sound-visual-curation-wave6.json'
      - 'data/rebus-sound-visual-curation-wave7.json'
      - 'data/rebus-sound-visual-curation-wave8.json'
      - 'data/rebus-materialization-wave1.json'
      - 'data/rebus-materialization-wave2.json'
      - 'data/rebus-materialization-wave3.json'
      - 'data/rebus-spontaneous-naming-pilot.json'
      - 'data/rebus-spontaneous-naming-responses-template.csv'
      - 'data/rebus-visible-conventions.json'
      - 'data/rebus-pronunciation-lexicon.json'
      - '.github/workflows/representation-landscape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  landscape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard evidence levels and long-piece competition
        run: node tests/rebus-representation-landscape.test.mjs
      - name: Merge editorial curation waves
        run: |
          mkdir -p .cache
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation.json','utf8'));
          const wave2=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave2.json','utf8'));
          const wave3=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave3.json','utf8'));
          const wave4=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave4.json','utf8'));
          const wave5=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave5.json','utf8'));
          const wave6=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave6.json','utf8'));
          const wave7=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave7.json','utf8'));
          const wave8=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave8.json','utf8'));
          const merged={...base,version:`${base.version}+${wave2.version}+${wave3.version}+${wave4.version}+${wave5.version}+${wave6.version}+${wave7.version}+${wave8.version}`,entries:[...(base.entries||[]),...(wave2.entries||[]),...(wave3.entries||[]),...(wave4.entries||[]),...(wave5.entries||[]),...(wave6.entries||[]),...(wave7.entries||[]),...(wave8.entries||[])]};
          fs.writeFileSync('.cache/rebus-sound-visual-curation-merged.json',JSON.stringify(merged,null,2)+'\n');
          console.log(JSON.stringify({baseEntries:base.entries?.length||0,wave2Entries:wave2.entries?.length||0,wave3Entries:wave3.entries?.length||0,wave4Entries:wave4.entries?.length||0,wave5Entries:wave5.entries?.length||0,wave6Entries:wave6.entries?.length||0,wave7Entries:wave7.entries?.length||0,wave8Entries:wave8.entries?.length||0,mergedEntries:merged.entries.length},null,2));
          NODE
      - name: Build representation landscape
        run: node scripts/build-representation-landscape.mjs data/rebus-representation-bank-audit.json .cache/rebus-sound-visual-curation-merged.json
      - name: Benchmark natural phrases
        run: node scripts/benchmark-real-phrase-paths.mjs
      - name: Verify conservative output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const landscape=JSON.parse(fs.readFileSync('data/rebus-representation-landscape.json','utf8'));
          const benchmark=JSON.parse(fs.readFileSync('data/rebus-real-phrase-benchmark.json','utf8'));
          const wave2=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave2.json','utf8'));
          const wave3=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave3.json','utf8'));
          const wave4=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave4.json','utf8'));
          const wave5=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave5.json','utf8'));
          const wave6=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave6.json','utf8'));
          const wave7=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave7.json','utf8'));
          const wave8=JSON.parse(fs.readFileSync('data/rebus-sound-visual-curation-wave8.json','utf8'));
          const materialization1=JSON.parse(fs.readFileSync('data/rebus-materialization-wave1.json','utf8'));
          const materialization2=JSON.parse(fs.readFileSync('data/rebus-materialization-wave2.json','utf8'));
          const materialization3=JSON.parse(fs.readFileSync('data/rebus-materialization-wave3.json','utf8'));
          const namingPilot=JSON.parse(fs.readFileSync('data/rebus-spontaneous-naming-pilot.json','utf8'));
          if(landscape.stats.exactLexicalBacklogSoundCount<5000)throw new Error('Expected the large exact lexical reservoir, got '+landscape.stats.exactLexicalBacklogSoundCount);
          if(landscape.rows.some(row=>row.automaticActivation!==false||row.clinicalEvidence!=='none'))throw new Error('Landscape must never auto-activate or infer clinical evidence');
          if(landscape.rows.flatMap(row=>row.exactCandidates||[]).some(candidate=>candidate.automaticActivation!==false||candidate.clinicalEvidence!=='none'))throw new Error('Candidate evidence leaked activation or clinical status');
          for(const [name,wave] of [['wave2',wave2],['wave3',wave3],['wave4',wave4],['wave5',wave5],['wave6',wave6],['wave7',wave7],['wave8',wave8]])if(wave.entries.some(item=>item.humanNamingEvidence!=='none'||item.clinicalEvidence!=='none'||item.spontaneousNamingRisk!=='unknown'))throw new Error(name+' must not invent human naming or clinical evidence');
          if(wave3.summary.examinedSoundCount<40||wave3.summary.prototypeCandidateCount<20)throw new Error('Wave 3 is not substantive enough');
          if(wave4.summary.examinedSoundCount<30||wave4.summary.prototypeCandidateCount<15)throw new Error('Wave 4 is not substantive enough');
          if(wave5.summary.examinedSoundCount<30||wave5.summary.prototypeCandidateCount<15||wave5.summary.phoneticGapQuotaExaminedCount<10)throw new Error('Wave 5 balance changed');
          if(wave6.summary.examinedSoundCount<30||wave6.summary.prototypeCandidateCount<10||wave6.summary.phoneticGapQuotaExaminedCount<10)throw new Error('Wave 6 balance changed');
          if(wave7.summary.examinedSoundCount<60||wave7.summary.prototypeCandidateCount<30||wave7.summary.twoSyllablePrimaryExaminedCount<15||wave7.summary.phoneticGapQuotaExaminedCount<10||wave7.summary.visibleConventionExaminedCount<20||wave7.summary.newVisibleConventionDefinitionCount!==0)throw new Error('Wave 7 scale/balance changed');
          if(wave8.summary.examinedSoundCount!==60||wave8.summary.prototypeCandidateCount!==46||wave8.summary.expectedNetNewCuratedSoundCount!==46)throw new Error('Wave 8 net-new yield changed');
          if(wave8.summary.oInitialExaminedCount!==20||wave8.summary.oInitialPrototypeCount!==9||wave8.summary.twoSyllablePromotedCount!==33)throw new Error('Wave 8 /o…/ or two-syllable quota changed');
          if(wave8.summary.plannerReadyPromotionCount!==0||wave8.summary.newStimulusCount!==0)throw new Error('Wave 8 must not fabricate planner promotion or materialization');
          if(wave8.entries.some(item=>item.automaticActivation!==false))throw new Error('Wave 8 must never auto-activate');
          if(wave8.entries.filter(item=>item.decision==='prototype_candidate').some(item=>item.netNewCoverageAtSelection!==true))throw new Error('Wave 8 prototypes must target net-new curation coverage');
          for(const [name,wave] of [['wave4',wave4],['wave5',wave5],['wave6',wave6],['wave7',wave7],['wave8',wave8]]){
            const prototypeCount=wave.entries.filter(item=>item.decision==='prototype_candidate').length;
            const deferredCount=wave.entries.filter(item=>item.decision==='defer_candidate').length;
            const lexicalCount=wave.entries.reduce((sum,item)=>sum+(item.comparedExactCandidates?.length||0),0);
            if(wave.entries.length!==wave.summary.examinedSoundCount)throw new Error(`${name} entry count mismatch`);
            if(prototypeCount!==wave.summary.prototypeCandidateCount||deferredCount!==wave.summary.deferredCandidateCount)throw new Error(`${name} decision count mismatch`);
            if(lexicalCount!==wave.summary.comparedExactLexicalCandidateCount)throw new Error(`${name} lexical comparison count mismatch`);
          }
          if(landscape.stats.curatedVisualHypothesisSoundCount<196)throw new Error('Wave 8 failed to add the expected net-new curated sounds: '+landscape.stats.curatedVisualHypothesisSoundCount);
          for(const [name,materialization] of [['materialization1',materialization1],['materialization2',materialization2],['materialization3',materialization3]]){
            if(materialization.status!=='research_stimuli_only')throw new Error(name+' left research-only status');
            if(materialization.entries.some(item=>item.humanNamingEvidence!=='none'||item.clinicalEvidence!=='none'||item.spontaneousNamingRisk!=='unknown'))throw new Error(name+' invented naming or clinical evidence');
            for(const item of materialization.entries.filter(item=>item.decision==='new_research_stimulus_created'))if(!fs.existsSync(item.asset))throw new Error('Missing research stimulus '+item.asset);
          }
          if(materialization1.summary.newAssetsCreated!==4||materialization2.summary.newAssetsCreated!==4)throw new Error('Historical materialization waves changed unexpectedly');
          if(materialization3.summary.newAssetsCreated!==0||materialization3.summary.registeredAssetsPromoted!==0)throw new Error('Wave 3 materialization must not fabricate a new or registered asset');
          if(namingPilot.status!=='prepared_no_human_data'||namingPilot.evidenceState.humanParticipantsObserved!==0||namingPilot.evidenceState.humanNamingEvidence!=='none'||namingPilot.evidenceState.clinicalEvidence!=='none')throw new Error('Naming pilot must remain preparation only');
          if(namingPilot.stimuli.length!==8||namingPilot.stimuli.some(item=>item.humanNamingEvidence!=='none'||item.clinicalEvidence!=='none'||item.spontaneousNamingRisk!=='unknown'||!fs.existsSync(item.asset)))throw new Error('Naming pilot stimulus evidence/path invalid');
          const responseTemplate=fs.readFileSync('data/rebus-spontaneous-naming-responses-template.csv','utf8').trim().split(/\r?\n/);
          if(responseTemplate.length!==1)throw new Error('Naming response template must contain no fabricated participant rows');
          const historical=benchmark.rows.find(row=>row.phrase==='Elles ne sont pas cuites les pâtes');
          if(!historical?.pronunciationComplete)throw new Error('Historical end-to-end phrase is no longer lexically resolved');
          if(!landscape.rows.some(row=>row.longWindowPotential?.coversTwoSyllables))throw new Error('Two-syllable windows disappeared from the landscape');
          console.log(JSON.stringify({landscape:landscape.stats,benchmark:benchmark.summary,wave8:wave8.summary},null,2));
          NODE
      - name: Upload landscape artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebulo-representation-landscape
          path: |
            data/rebus-representation-landscape.json
            docs/REBUS_REPRESENTATION_LANDSCAPE.md
            data/rebus-real-phrase-benchmark.json
            docs/REBUS_REAL_PHRASE_BENCHMARK.md
      - name: Commit generated landscape on main
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-representation-landscape.json docs/REBUS_REPRESENTATION_LANDSCAPE.md data/rebus-real-phrase-benchmark.json docs/REBUS_REAL_PHRASE_BENCHMARK.md
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh representation landscape and phrase benchmark'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
