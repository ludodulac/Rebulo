name: Phoneme fragment index

on:
  push:
    paths:
      - '.github/workflows/phoneme-fragment-index.yml'
      - 'scripts/build-rebus-phoneme-fragment-index.mjs'
      - 'src/rebus-phoneme-fragments.js'
      - 'src/rebus-sound-catalog.js'
      - 'data/rebus-fragment-representation-ideas.json'
      - 'data/rebus-visible-conventions.json'
      - 'tests/rebus-sound-catalog.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/phoneme-fragment-index.yml'
      - 'scripts/build-rebus-phoneme-fragment-index.mjs'
      - 'src/rebus-phoneme-fragments.js'
      - 'src/rebus-sound-catalog.js'
      - 'data/rebus-fragment-representation-ideas.json'
      - 'data/rebus-visible-conventions.json'
      - 'tests/rebus-sound-catalog.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fragment regressions
        run: node tests/rebus-sound-catalog.test.mjs
      - name: Download Lexique 4 mirror
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/dorfner/pass_the_bomb/master/Lexique400/Lexique4.tsv' -o .cache/Lexique4.tsv
          test "$(wc -l < .cache/Lexique4.tsv)" -gt 180000
      - name: Import compact lexical data
        run: node scripts/import-lexique.mjs .cache/Lexique4.tsv .cache/lexique4.compact.json
      - name: Build exhaustive fragment index
        run: node scripts/build-rebus-phoneme-fragment-index.mjs .cache/lexique4.compact.json data/rebus-phoneme-fragment-index.json docs/PHONEME_FRAGMENT_INDEX_REPORT.md
      - name: Verify index scale and proof boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('data/rebus-phoneme-fragment-index.json','utf8'));
          if(report.formatVersion!==1)throw new Error('unexpected fragment index format');
          if(!(report.stats?.fragmentCount>10000))throw new Error(`fragment inventory unexpectedly small: ${report.stats?.fragmentCount}`);
          if(!(report.stats?.withinSyllableFragmentCount>0))throw new Error('within-syllable fragments missing');
          if(!(report.stats?.crossSyllableFragmentCount>0))throw new Error('cross-syllable fragments missing');
          if(!(report.stats?.withExactLexicalCandidateCount>0))throw new Error('exact lexical leads missing');
          if(!(report.stats?.withEditorialIdeaCount>0))throw new Error('editorial textual briefs missing');
          if(!(report.stats?.withVisibleConventionCount>0))throw new Error('visible conventions missing');
          const schema=report.rowSchema;const ipaIndex=schema.indexOf('ipa');const ideasIndex=schema.indexOf('editorialIdeas');
          const byIpa=new Map(report.fragmentRows.map(row=>[row[ipaIndex],row]));
          for(const ipa of ['ʁɛ','lɛ','ɥil','kɥi','ø','dø','œ̃','ɔ̃z'])if(!byIpa.has(ipa))throw new Error(`expected fragment missing: /${ipa}/`);
          const near=byIpa.get('ɛ̃')?.[ideasIndex]||[];
          if(!near.some(tuple=>tuple[3]==='playful_near'))throw new Error('near un/in relation was not kept separate');
          console.log(JSON.stringify(report.stats,null,2));
          NODE
      - name: Upload fragment research artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebus-phoneme-fragment-index
          path: |
            data/rebus-phoneme-fragment-index.json
            docs/PHONEME_FRAGMENT_INDEX_REPORT.md
          retention-days: 14
      - name: Commit generated index on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rebus-phoneme-fragment-index.json docs/PHONEME_FRAGMENT_INDEX_REPORT.md
          if git diff --cached --quiet; then echo 'No fragment index changes to commit.'; exit 0; fi
          git commit -m 'Refresh exhaustive phoneme fragment index'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
