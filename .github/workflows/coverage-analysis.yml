name: Full Lexique 4 coverage analysis

on:
  push:
    paths:
      - '.github/workflows/coverage-analysis.yml'
      - 'scripts/analyze-coverage.mjs'
      - 'scripts/analyze-productivity.mjs'
      - 'scripts/import-lexique.mjs'
      - 'scripts/simulate-expansion.mjs'
      - 'src/phonetic-engine.js'
      - 'src/phonetic-productivity.js'
      - 'src/open-pictogram-library.js'
      - 'src/open-pictogram-library-wave2.js'
      - 'src/open-pictogram-library-wave3.js'
      - 'src/pictogram-print-sheets.js'
      - 'data/lexicon-seed.json'
      - 'data/pictogram-priorities.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run project tests
        run: npm test

      - name: Download Lexique 4 mirror
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/dorfner/pass_the_bomb/master/Lexique400/Lexique4.tsv' \
            -o .cache/Lexique4.tsv
          test "$(wc -l < .cache/Lexique4.tsv)" -gt 180000
          sha256sum .cache/Lexique4.tsv | tee .cache/Lexique4.sha256

      - name: Import compact lexical data
        run: node scripts/import-lexique.mjs .cache/Lexique4.tsv .cache/lexique4.compact.json

      - name: Run strict coverage analysis
        run: node scripts/analyze-coverage.mjs .cache/lexique4.compact.json data/lexicon-seed.json data/coverage-report.json

      - name: Run merged-library productivity analysis
        run: node scripts/analyze-productivity.mjs .cache/lexique4.compact.json data/lexicon-seed.json data/phonetic-productivity-report.json

      - name: Simulate curated pictogram expansion
        run: node scripts/simulate-expansion.mjs .cache/lexique4.compact.json data/lexicon-seed.json data/pictogram-priorities.json data/expansion-simulation.json

      - name: Add provenance and compact summaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha256=fs.readFileSync('.cache/Lexique4.sha256','utf8').trim().split(/\s+/)[0];
          const provenance={
            canonicalSource:'https://www.lexique.org/databases/Lexique400/Lexique400.tsv',
            mirror:'https://github.com/dorfner/pass_the_bomb/blob/master/Lexique400/Lexique4.tsv',
            sha256,
            license:'CC BY-SA 4.0'
          };

          const p='data/coverage-report.json';
          const report=JSON.parse(fs.readFileSync(p,'utf8'));
          report.provenance=provenance;
          fs.writeFileSync(p,JSON.stringify(report,null,2));
          const top=report.missingSounds.slice(0,30);
          const candidates=x=>{
            const nouns=(x.exactNounCandidates||[]).slice(0,4).map(y=>y.word);
            const any=(x.exactWholeWordCandidates||[]).slice(0,4).map(y=>y.word);
            return (nouns.length?nouns:any).join(', ')||'—';
          };
          const lines=[
            '# Rebulo — couverture phonétique Lexique 4','',
            `- Entrées analysées : ${report.lexicalEntryCount}`,
            `- Formes orthographiques uniques : ${report.uniqueWordFormCount}`,
            `- Pictogrammes actifs : ${report.pictogramCount}`,
            `- Entrées strictement constructibles : ${report.strictConstructibleCount}`,
            `- Mots uniques strictement constructibles : ${report.strictConstructibleUniqueWordCount}`,
            `- Entrées en vrais rébus (2+ pièces) : ${report.strictMultiPieceCount}`,
            `- Mots uniques en vrais rébus (2+ pièces) : ${report.strictMultiPieceUniqueWordCount}`,
            `- Couverture brute : ${(report.strictCoverage*100).toFixed(4)} %`,
            `- Couverture rébus 2+ pièces : ${(report.strictMultiPieceCoverage*100).toFixed(4)} %`,'',
            '## 30 segments manquants les mieux classés','',
            '| Rang | Segment IPA | Formes débloquées | Gain pondéré | Candidats mot-entier exacts |',
            '|---:|---|---:|---:|---|',
            ...top.map(x=>`| ${x.rank} | /${x.ipa}/ | ${x.unlockCount} | ${x.weightedGain} | ${candidates(x)} |`),'',
            '> Les candidats mot-entier sont seulement des homophones exacts trouvés dans Lexique 4, avec priorité aux noms. Ils ne sont pas automatiquement imageables ni cliniquement admissibles : la stabilité de dénomination et la reconnaissance visuelle restent obligatoires.'
          ];
          fs.writeFileSync('docs/COVERAGE_ANALYSIS.md',lines.join('\n')+'\n');

          const prodPath='data/phonetic-productivity-report.json';
          const prod=JSON.parse(fs.readFileSync(prodPath,'utf8'));
          prod.provenance=provenance;
          fs.writeFileSync(prodPath,JSON.stringify(prod,null,2));
          const productives=(prod.productiveTokens||[]).slice(0,80);
          const prodLines=[
            '# Rebulo — productivité phonétique des pictogrammes','',
            `- Entrées Lexique analysées : ${prod.lexicalEntryCount}`,
            `- Inventaire fusionné : ${prod.inventory.mergedCount} concepts (${prod.inventory.seedCount} seed + ${prod.inventory.openLibraryCount} entrées OpenMoji avant déduplication).`,
            `- Pièces strictement productives : ${prod.stats.productive}`,
            `- Candidats stricts sans preuve : ${prod.stats.candidates}`,
            `- Concepts général seulement : ${prod.stats.generalOnly}`,
            `- Cibles uniques en vrais rébus stricts : ${prod.stats.strictRebuses}`,'',
            'Une pièce est dite **productive** seulement si son mot entier et sa prononciation entière participent à au moins un rébus exact de 2 à 4 pièces. Les candidats ne comptent pas comme couverture productive.','',
            '## Pièces productives les plus utilisées','',
            '| Pièce | IPA entière | Cibles strictes | Exemples |',
            '|---|---|---:|---|',
            ...productives.map(x=>`| ${x.label} | /${x.normalizedIPA}/ | ${x.strictUseCount} | ${(x.strictExamples||[]).slice(0,3).map(e=>e.word).join(', ')||'—'} |`),'',
            '> Cette mesure est structurelle et lexicale. Elle ne constitue ni une validation clinique ni un test de dénomination des images. Un pictogramme `active:false` ne participe pas au calcul strict.'
          ];
          fs.writeFileSync('docs/PHONETIC_PRODUCTIVITY.md',prodLines.join('\n')+'\n');

          const sim=JSON.parse(fs.readFileSync('data/expansion-simulation.json','utf8'));
          const simLines=[
            '# Rebulo — simulation gloutonne d’expansion','',
            `- Base : ${sim.baseline.multiPieceUniqueWords} mots uniques en rébus de 2+ pièces.`,
            `- Candidats testés : ${sim.candidatePool.length}.`,'',
            '| Étape | Brique ajoutée | IPA | Gain marginal de vrais rébus | Total cumulatif |',
            '|---:|---|---|---:|---:|',
            ...sim.greedyOrder.map(x=>`| ${x.step} | ${x.addedLabel} | ${x.ipa} | +${x.marginalMultiPieceUniqueWords} | ${x.cumulativeMultiPieceUniqueWords} |`),'',
            '## Prototypes inactifs : impact simulé','',
            '| Scénario | Gain strict 2+ pièces | Gain constructible | Total strict 2+ pièces | Exemples |',
            '|---|---:|---:|---:|---|',
            ...(sim.prototypeScenarios||[]).map(x=>`| ${x.name} | +${x.strictMultiPieceGain} | +${x.strictConstructibleGain} | ${x.cumulativeMultiPieceUniqueWords} | ${(x.examples||[]).slice(0,5).map(e=>`${e.word} = ${e.pieces.join(' + ')}`).join('; ')||'—'} |`),'',
            '> Les prototypes restent inactifs : cette simulation mesure seulement leur rendement lexical strict, pas leur validation visuelle ou clinique.'
          ];
          fs.writeFileSync('docs/EXPANSION_SIMULATION.md',simLines.join('\n')+'\n');
          NODE

      - name: Commit analysis results
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'rebulo-analysis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/coverage-report.json data/phonetic-productivity-report.json data/expansion-simulation.json docs/COVERAGE_ANALYSIS.md docs/PHONETIC_PRODUCTIVITY.md docs/EXPANSION_SIMULATION.md
          if git diff --cached --quiet; then
            echo 'No analysis changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh Lexique 4 coverage, productivity and expansion simulation'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
