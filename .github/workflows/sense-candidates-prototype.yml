name: Sense candidates prototype

on:
  push:
    branches:
      - analysis/sense-candidates-prototype
    paths:
      - scripts/build-sense-candidates-prototype.mjs
      - tests/sense-candidates-prototype.test.mjs
      - .github/workflows/sense-candidates-prototype.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/sense-candidates-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build prototype
        run: node scripts/build-sense-candidates-prototype.mjs
      - name: Validate prototype
        if: ${{ hashFiles('tests/sense-candidates-prototype.test.mjs') != '' }}
        run: node tests/sense-candidates-prototype.test.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "rebulo-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sense-candidates-calibration-400.jsonl data/sense-candidates-calibration-400-metrics.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize senseCandidates calibration corpus"
            git push origin HEAD:analysis/sense-candidates-prototype
          fi
