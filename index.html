<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Rebulo — Créer un rébus</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="audit.css"></head>
<body><main class="app-shell">
<header class="topbar"><h1>Rebulo</h1><span class="strict-badge" title="Rebulo garde tous les sons">✓ Sons exacts</span></header>
<section class="hero-card" aria-labelledby="creator-title"><p class="step">1</p><h2 id="creator-title">Écris un mot</h2>
<form id="creatorForm" class="creator-form"><label class="sr-only" for="target">Mot à transformer</label><div class="creator-row"><input id="target" type="text" autocomplete="off" autocapitalize="none" placeholder="Ex. merci" value="merci" aria-label="Mot à transformer"><button type="submit">Créer</button></div></form><div id="creatorFeedback" class="creator-feedback" aria-live="polite"></div>
<section id="result" class="result-card" data-sheet-mode="pro" hidden><div class="result-head"><div><p id="resultLabel" class="result-label">Correction pro</p><h3 id="resultWord">Merci</h3><p id="sheetInstruction" class="sheet-instruction"></p></div><button id="changeImage" type="button" class="secondary small">Changer l’image</button></div>
<div class="sheet-mode" role="group" aria-label="Type de fiche"><button id="childMode" type="button" class="secondary small" aria-pressed="false">👧 Enfant</button><button id="proMode" type="button" class="small" aria-pressed="true">🧑 Pro</button></div>
<section id="therapyPanel" class="therapy-panel" hidden><strong id="therapyLabel"></strong><p id="therapyDescription" class="therapy-description"></p><p id="therapyInstruction" class="therapy-instruction"></p></section>
<div id="creatorRebus" class="rebus-row" aria-live="polite"></div><p id="phoneticProof" class="phonetic-proof"></p><div id="worksheetAnswer" class="worksheet-answer" hidden>Réponse : <span aria-hidden="true"></span></div>
<div class="primary-actions"><button id="addToWorksheet" type="button">＋ Ajouter</button><button id="downloadRebus" type="button" class="secondary">PDF</button></div><p id="exportFeedback" class="export-feedback" aria-live="polite"></p>
<details class="more-options"><summary>Plus d’options</summary><div class="advanced-content"><div class="worksheet-fields"><label for="patientName">Nom<input id="patientName" type="text" autocomplete="off" placeholder="Facultatif"></label><label for="sessionDate">Date<input id="sessionDate" type="date"></label><label for="worksheetLevel">Niveau<select id="worksheetLevel"><option value="">Non indiqué</option><option value="Découverte">Découverte</option><option value="Entraînement">Entraînement</option><option value="Consolidation">Consolidation</option></select></label><label for="therapyActivity">Activité<select id="therapyActivity"></select></label><label for="worksheetLayout">PDF<select id="worksheetLayout"><option value="1">1 par page</option><option value="2">2 par page</option><option value="4">4 par page</option></select></label></div>
<details id="assetAuditPanel" class="asset-audit"><summary>Images : validation</summary><p id="assetAuditSummary" class="asset-audit-summary"></p><div id="assetAuditList" class="asset-audit-list"></div></details><button id="printRebus" type="button" class="secondary full-action">Imprimer</button></div></details>
<section class="session-card"><div class="queue-actions"><div><strong>Ma séance</strong><span id="queueCount">0 / 4</span></div></div><div id="worksheetQueue" class="worksheet-queue" aria-live="polite"></div><button id="downloadSeries" type="button" class="secondary full-action" disabled>PDF de la séance</button></section></section></section>
<details class="info-panel"><summary>Comment ça marche ?</summary><p>Chaque image garde tous les sons de son nom. Si Rebulo ne trouve pas une solution exacte, il refuse le mot.</p></details>
<details class="legacy-panel"><summary>Jeu</summary><section class="controls" aria-label="Réglages du jeu"><label for="age">Âge</label><select id="age"><option value="5">5–6 ans</option><option value="7" selected>7–8 ans</option><option value="9">9–11 ans</option><option value="12">12 ans et +</option></select><button id="newRebus" type="button">Nouveau</button></section><section class="game-card"><div class="game-meta"><span id="difficulty">Niveau 1</span><span id="streak">🔥 0</span><span class="score-box">⭐ <strong id="score">0</strong></span></div><p class="prompt">Quel mot entends-tu ?</p><div id="rebus" class="rebus-row"></div><form id="answerForm"><label class="sr-only" for="answer">Ta réponse</label><div class="answer-row"><input id="answer" type="text" autocomplete="off" autocapitalize="none" placeholder="Ta réponse…"><button type="submit">OK</button></div></form><div class="secondary-actions"><button id="hint" type="button" class="secondary">💡 Indice</button><button id="solution" type="button" class="secondary">👀 Réponse</button></div><p id="feedback" class="feedback"></p></section></details>
</main><script src="app.js" type="module"></script></body></html>
